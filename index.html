<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>Wedding Halls ERP | إدارة قاعات الأفراح</title>
<style>
:root{--navy:#17263c;--navy2:#203752;--gold:#c79a43;--bg:#f3f5f8;--card:#fff;--text:#202b3c;--muted:#748094;--line:#e4e8ef;--green:#21845a;--red:#c34b50;--blue:#3976d2;--orange:#bb7b20;--shadow:0 6px 24px #14233b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:white}button:hover{filter:brightness(1.08)}button.secondary{background:#edf1f6;color:var(--navy)}button.gold{background:var(--gold);color:#fff}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:6px 9px;font-size:12px}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:22px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:0 7px 22px;border-bottom:1px solid #ffffff20}.brandmark{width:42px;height:42px;border-radius:13px;background:var(--gold);display:grid;place-items:center;font-size:22px}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:#c1ccda;margin:5px 0 0}.navlabel{font-size:11px;color:#92a5bc;padding:22px 12px 8px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#c7d1df;text-align:right;display:flex;align-items:center;gap:12px;padding:12px;border-radius:9px}.nav button.active,.nav button:hover{background:#ffffff16;color:#fff}.nav .ico{width:22px;text-align:center;font-size:17px}.sidebarfoot{margin-top:28px;padding:14px 10px;border-top:1px solid #ffffff20;color:#aebdd0;font-size:11px;line-height:1.8}.main{min-width:0}.topbar{background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:4}.topbar h2{font-size:20px;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:5px 0 0}.topactions{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#e9eef6;color:var(--navy);display:grid;place-items:center;font-weight:bold}.content{padding:25px 28px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.pagehead h3{margin:0;font-size:20px}.pagehead p{margin:6px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:38px;height:38px;border-radius:11px;background:#edf2f8;display:grid;place-items:center;font-size:19px}.stat strong{font-size:26px;display:block;margin:13px 0 5px}.stat small{color:var(--muted);font-size:11px}.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:17px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}.panelhead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panelhead h4{margin:0;font-size:15px}.panelbody{padding:17px 19px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:right;padding:13px 15px;border-bottom:1px solid #edf0f4;font-size:12px;white-space:nowrap}th{background:#fafbfd;color:#69768a;font-weight:600}tbody tr:hover{background:#fafcff}tbody tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:30px;font-size:11px;background:#eef2f7;color:#506076}.badge.green{background:#e8f7ef;color:#21845a}.badge.orange{background:#fff4df;color:#a66b11}.badge.red{background:#ffeded;color:#bd4148}.badge.blue{background:#eaf2ff;color:#2f67bb}.searchrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.searchrow input,.searchrow select{max-width:260px}.field{display:grid;gap:7px}.field label{font-size:12px;color:#536176;font-weight:600}.field input,.field select,.field textarea,.searchrow input,.searchrow select{width:100%;padding:11px 12px;border:1px solid #dce2ea;border-radius:9px;background:#fff;outline:none;color:var(--text)}.field input:focus,.field select:focus,.field textarea:focus,.searchrow input:focus{border-color:#799ac8;box-shadow:0 0 0 3px #3976d21a}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.formgrid .full{grid-column:1/-1}.formfoot{display:flex;justify-content:flex-start;gap:9px;margin-top:18px}.empty{text-align:center;color:var(--muted);padding:35px}.empty div{font-size:28px;margin-bottom:8px}.hallcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.hallcard{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}.hallhero{height:100px;background:linear-gradient(135deg,#243c58,#c29a52);display:flex;align-items:center;justify-content:center;font-size:38px;color:white}.hallinfo{padding:14px}.hallinfo h4{margin:0 0 8px}.hallinfo p{font-size:12px;color:var(--muted);margin:6px 0}.hallinfo .price{font-weight:bold;color:var(--navy);font-size:16px;margin:12px 0}.hallfoot{border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-right:1px solid var(--line)}.dayname,.daycell{padding:9px;min-height:86px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px}.dayname{background:#f8f9fb;min-height:auto;text-align:center;font-weight:bold;color:#6c788b}.daycell .daynum{font-weight:bold;margin-bottom:7px}.calitem{display:block;border-radius:5px;padding:4px;margin-top:3px;background:#e9f1ff;color:#2e5fa5;font-size:10px;white-space:normal}.calitem.pending{background:#fff0d5;color:#966312}.notice{padding:12px 14px;border-radius:9px;background:#fff7e7;color:#855d18;font-size:12px;line-height:1.8;margin-bottom:16px}.modalback{position:fixed;inset:0;background:#111c2d88;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modalback.open{display:flex}.modal{background:#fff;border-radius:16px;width:min(700px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 70px #0003}.modalhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0;font-size:17px}.xbtn{background:#f0f2f5;color:#536176;padding:6px 10px}.modalbody{padding:22px}.toast{position:fixed;bottom:20px;left:20px;background:#18334a;color:#fff;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:40;display:none;max-width:90vw}.toast.show{display:block;animation:fade 3s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0;display:none}}.money{font-variant-numeric:tabular-nums}.quicklinks{display:flex;gap:8px;flex-wrap:wrap}.quicklinks button{background:#eef2f7;color:#263d58}.timeline{display:grid;gap:11px}.timelineitem{display:flex;gap:11px;align-items:flex-start;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:4px;flex-shrink:0}.timelineitem b{display:block;margin-bottom:4px}.reporttiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.reporttile{padding:16px;border:1px solid var(--line);border-radius:12px}.reporttile span{font-size:12px;color:var(--muted)}.reporttile strong{display:block;font-size:20px;margin-top:10px}.mobilemenu{display:none}
@media(max-width:1000px){.app{grid-template-columns:210px 1fr}.content{padding:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.hallcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:10;right:-270px;width:250px;transition:right .2s}.sidebar.open{right:0}.mobilemenu{display:inline-block}.topbar{padding:13px 15px}.topbar h2{font-size:16px}.content{padding:15px}.pagehead{align-items:flex-start;flex-direction:column}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:21px}.stat-icon{width:31px;height:31px}.hallcards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.reporttiles{grid-template-columns:1fr}.dayname,.daycell{padding:4px;min-height:62px;font-size:9px}.calitem{font-size:8px;padding:2px}.topactions .rolelabel{display:none}}
</style>

<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">♛</div><div><h1>Wedding Halls ERP</h1><p>إدارة قاعات الأفراح</p></div></div><div class="navlabel">القائمة الرئيسية</div><nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span>لوحة التحكم</button><button data-page="bookings"><span class="ico">▣</span>الحجوزات</button><button data-page="calendar"><span class="ico">▦</span>تقويم القاعات</button><button data-page="halls"><span class="ico">⌂</span>القاعات</button><button data-page="clients"><span class="ico">♙</span>العملاء</button><button data-page="payments"><span class="ico">ج.م</span>التحصيلات</button><button data-page="expenses"><span class="ico">↗</span>المصروفات</button><button data-page="reports"><span class="ico">▥</span>التقارير</button><button data-page="logs"><span class="ico">◷</span>سجل العمليات</button><button data-page="settings"><span class="ico">⚙</span>الإعدادات والنسخ الاحتياطي</button></nav><div class="sidebarfoot">نسخة تجريبية محلية<br>البيانات محفوظة على هذا المتصفح</div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:11px"><button class="mobilemenu secondary" onclick="toggleMenu()">☰</button><div><h2 id="topTitle">لوحة التحكم</h2><p id="todayText"></p></div></div><div class="topactions"><span class="rolelabel muted" style="font-size:12px">مدير النظام</span><div class="avatar">م</div></div></header><section class="content" id="content"></section></main></div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3 id="modalTitle"></h3><button class="xbtn" onclick="closeModal()">✕</button></div><div class="modalbody" id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='weddingHallsERP_v1';
const initial={halls:[{id:'H001',name:'قاعة اللؤلؤة',capacity:350,price:45000,location:'القاهرة',status:'نشطة',notes:'قاعة رئيسية'},{id:'H002',name:'قاعة الياسمين',capacity:200,price:30000,location:'القاهرة',status:'نشطة',notes:'قاعة متوسطة'},{id:'H003',name:'الحديقة الملكية',capacity:500,price:60000,location:'القاهرة',status:'نشطة',notes:'قاعة مفتوحة'}],clients:[],bookings:[],payments:[],expenses:[],logs:[],settings:{company:'Wedding Halls ERP',currency:'ج.م'}};
let db=loadDB(),page='dashboard',bookingFilter='',searchText='';
function loadDB(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.halls?x:structuredClone(initial)}catch(e){return structuredClone(initial)}}function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}function id(prefix){return prefix+Date.now().toString().slice(-8)+Math.floor(Math.random()*90+10)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n||0).toLocaleString('en-US')+' ج.م'}function today(){return new Date().toISOString().slice(0,10)}function fmtDate(s){if(!s)return '—';let d=new Date(s+'T12:00:00');return d.toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'})}function statusBadge(s){let cl={'مؤكد':'green','مبدئي':'orange','مكتمل':'blue','ملغي':'red','نشطة':'green','غير نشطة':'red'}[s]||'';return `<span class="badge ${cl}">${esc(s)}</span>`}function log(action,detail){db.logs.unshift({id:id('L'),action,detail,user:'مدير النظام',date:new Date().toLocaleString('ar-EG')});db.logs=db.logs.slice(0,500);saveDB()}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}function go(p){page=p;searchText='';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('sidebar').classList.remove('open');render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});document.getElementById('todayText').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
const titles={dashboard:'لوحة التحكم',bookings:'إدارة الحجوزات',calendar:'تقويم القاعات',halls:'إدارة القاعات',clients:'إدارة العملاء',payments:'التحصيلات والمدفوعات',expenses:'المصروفات',reports:'التقارير المالية والتشغيلية',logs:'سجل العمليات',settings:'الإعدادات والنسخ الاحتياطي'};
function render(){document.getElementById('topTitle').textContent=titles[page];const c=document.getElementById('content');let fn={dashboard:dashboardPage,bookings:bookingsPage,calendar:calendarPage,halls:hallsPage,clients:clientsPage,payments:paymentsPage,expenses:expensesPage,reports:reportsPage,logs:logsPage,settings:settingsPage}[page];c.innerHTML=fn();wireSearch()}
function pageHead(title,sub,btn=''){return `<div class="pagehead"><div><h3>${title}</h3><p>${sub}</p></div><div class="actions">${btn}</div></div>`}
function dashboardPage(){let month=today().slice(0,7),bookings=db.bookings.filter(b=>b.date.startsWith(month)&&b.status!=='ملغي'),confirmed=bookings.filter(b=>b.status==='مؤكد'||b.status==='مكتمل'),todayB=db.bookings.filter(b=>b.date===today()&&b.status!=='ملغي'),revenue=db.payments.reduce((s,p)=>s+Number(p.amount||0),0),out=db.expenses.reduce((s,p)=>s+Number(p.amount||0),0),due=db.bookings.filter(b=>b.status!=='ملغي').reduce((s,b)=>s+Math.max(0,Number(b.total||0)-paidFor(b.id)),0);let recent=[...db.bookings].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,6);return `${pageHead('أهلاً بيك في إدارة القاعات','نظرة سريعة على الحجوزات والتحصيلات والتشغيل',`<button class="gold" onclick="openBooking()">＋ حجز جديد</button><button class="secondary" onclick="openHall()">＋ إضافة قاعة</button>`)}<div class="stats"><div class="stat"><div class="stat-top"><span>حجوزات الشهر</span><span class="stat-icon">▣</span></div><strong>${bookings.length}</strong><small>الحجوزات غير الملغاة</small></div><div class="stat"><div class="stat-top"><span>حفلات اليوم</span><span class="stat-icon">♛</span></div><strong>${todayB.length}</strong><small>حسب التاريخ المسجل</small></div><div class="stat"><div class="stat-top"><span>إجمالي التحصيلات</span><span class="stat-icon">ج.م</span></div><strong style="font-size:21px">${money(revenue)}</strong><small>كل المدفوعات المسجلة</small></div><div class="stat"><div class="stat-top"><span>مبالغ متبقية</span><span class="stat-icon">◷</span></div><strong style="font-size:21px">${money(due)}</strong><small>على الحجوزات غير الملغاة</small></div></div><div class="grid2"><div class="panel"><div class="panelhead"><h4>أحدث الحجوزات</h4><button class="secondary small" onclick="go('bookings')">عرض الكل ←</button></div>${recent.length?`<div class="tablewrap"><table><thead><tr><th>رقم الحجز</th><th>العميل</th><th>القاعة</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>${recent.map(b=>`<tr><td>${esc(b.id)}</td><td>${esc(b.clientName)}</td><td>${esc(hallName(b.hallId))}</td><td>${fmtDate(b.date)}</td><td>${statusBadge(b.status)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div>▣</div>لسه مفيش حجوزات مسجلة<br><button style="margin-top:12px" onclick="openBooking()">إضافة أول حجز</button></div>`}</div><div class="panel"><div class="panelhead"><h4>ملخص مالي</h4><button class="secondary small" onclick="go('reports')">التقارير</button></div><div class="panelbody"><div class="timeline"><div class="timelineitem"><span class="dot"></span><div><b>إجمالي التحصيلات</b><span class="muted">${money(revenue)}</span></div></div><div class="timelineitem"><span class="dot" style="background:#c34b50"></span><div><b>إجمالي المصروفات</b><span class="muted">${money(out)}</span></div></div><div class="timelineitem"><span class="dot" style="background:#21845a"></span><div><b>صافي الحركة النقدية</b><span class="muted">${money(revenue-out)}</span></div></div><div class="timelineitem"><span class="dot" style="background:#3976d2"></span><div><b>عدد القاعات النشطة</b><span class="muted">${db.halls.filter(h=>h.status==='نشطة').length} قاعة</span></div></div></div><div class="notice" style="margin:18px 0 0">الأرقام هنا مبنية على العمليات المسجلة في النسخة الحالية. صافي الحركة النقدية ليس بديلًا عن تقرير الأرباح المحاسبي الكامل.</div></div></div></div><div class="panel"><div class="panelhead"><h4>اختصارات سريعة</h4></div><div class="panelbody quicklinks"><button onclick="openClient()">＋ عميل جديد</button><button onclick="openPayment()">＋ تسجيل تحصيل</button><button onclick="openExpense()">＋ تسجيل مصروف</button><button onclick="go('calendar')">▦ عرض التقويم</button><button onclick="go('logs')">◷ سجل العمليات</button></div></div>`}
function paidFor(bid){return db.payments.filter(p=>p.bookingId===bid).reduce((s,p)=>s+Number(p.amount||0),0)}function hallName(hid){return db.halls.find(h=>h.id===hid)?.name||'قاعة محذوفة'}function clientName(cid){return db.clients.find(c=>c.id===cid)?.name||'عميل غير مسجل'}
function bookingsPage(){let arr=[...db.bookings].sort((a,b)=>(a.date+b.time).localeCompare(b.date+a.time));if(bookingFilter)arr=arr.filter(b=>b.status===bookingFilter);if(searchText)arr=arr.filter(b=>[b.id,b.clientName,b.phone,hallName(b.hallId)].join(' ').toLowerCase().includes(searchText.toLowerCase()));return `${pageHead('الحجوزات','إضافة ومتابعة وتعديل حجوزات القاعات',`<button class="gold" onclick="openBooking()">＋ حجز جديد</button>`)}<div class="panel"><div class="panelbody"><div class="searchrow"><input id="tableSearch" placeholder="ابحث برقم الحجز أو العميل أو الهاتف أو القاعة" value="${esc(searchText)}"><select id="statusFilter"><option value="">كل الحالات</option>${['مبدئي','مؤكد','مكتمل','ملغي'].map(s=>`<option ${bookingFilter===s?'selected':''}>${s}</option>`).join('')}</select><button class="secondary" onclick="clearBookingFilters()">مسح الفلاتر</button></div></div><div class="tablewrap">${arr.length?`<table><thead><tr><th>رقم الحجز</th><th>العميل</th><th>رقم الهاتف</th><th>القاعة</th><th>التاريخ</th><th>الوقت</th><th>الإجمالي</th><th>المتبقي</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${arr.map(b=>`<tr><td>${esc(b.id)}</td><td>${esc(b.clientName)}</td><td>${esc(b.phone)}</td><td>${esc(hallName(b.hallId))}</td><td>${fmtDate(b.date)}</td><td>${esc(b.time||'—')}</td><td>${money(b.total)}</td><td>${money(Math.max(0,b.total-paidFor(b.id)))}</td><td>${statusBadge(b.status)}</td><td><div class="actions"><button class="secondary small" onclick="openBooking('${b.id}')">تعديل</button><button class="secondary small" onclick="openPayment('${b.id}')">تحصيل</button><button class="danger small" onclick="deleteBooking('${b.id}')">إلغاء</button></div></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><div>▣</div>لا توجد حجوزات مطابقة للبحث</div>`}</div></div>`}
function clearBookingFilters(){bookingFilter='';searchText='';render()}function wireSearch(){let s=document.getElementById('tableSearch');if(s)s.addEventListener('input',e=>{searchText=e.target.value;let pos=s.selectionStart;render();let n=document.getElementById('tableSearch');n.focus();n.setSelectionRange(pos,pos)});let f=document.getElementById('statusFilter');if(f)f.addEventListener('change',e=>{bookingFilter=e.target.value;render()});let cs=document.getElementById('clientSearch');if(cs)cs.addEventListener('input',e=>{searchText=e.target.value;let pos=cs.selectionStart;render();let n=document.getElementById('clientSearch');n.focus();n.setSelectionRange(pos,pos)});let ps=document.getElementById('paymentSearch');if(ps)ps.addEventListener('input',e=>{searchText=e.target.value;let pos=ps.selectionStart;render();let n=document.getElementById('paymentSearch');n.focus();n.setSelectionRange(pos,pos)});let es=document.getElementById('expenseSearch');if(es)es.addEventListener('input',e=>{searchText=e.target.value;let pos=es.selectionStart;render();let n=document.getElementById('expenseSearch');n.focus();n.setSelectionRange(pos,pos)})}
function hallsPage(){return `${pageHead('القاعات','إدارة بيانات القاعات والسعة والأسعار',`<button class="gold" onclick="openHall()">＋ إضافة قاعة</button>`)}<div class="hallcards">${db.halls.map(h=>`<div class="hallcard"><div class="hallhero">⌂</div><div class="hallinfo"><h4>${esc(h.name)}</h4><p>⌖ ${esc(h.location||'—')}</p><p>♙ السعة: ${h.capacity} فرد</p><div class="price">${money(h.price)} <span class="muted" style="font-size:11px;font-weight:normal">/ سعر أساسي</span></div>${statusBadge(h.status)}</div><div class="hallfoot"><span class="muted" style="font-size:11px">${db.bookings.filter(b=>b.hallId===h.id&&b.status!=='ملغي').length} حجز</span><div class="actions"><button class="secondary small" onclick="openHall('${h.id}')">تعديل</button><button class="danger small" onclick="deleteHall('${h.id}')">حذف</button></div></div></div>`).join('')||`<div class="empty">لا توجد قاعات</div>`}</div>`}
function clientsPage(){let arr=db.clients.filter(c=>!searchText||[c.name,c.phone,c.email].join(' ').toLowerCase().includes(searchText.toLowerCase()));return `${pageHead('العملاء','قاعدة بيانات العملاء ووسائل التواصل',`<button class="gold" onclick="openClient()">＋ عميل جديد</button>`)}<div class="panel"><div class="panelbody"><div class="searchrow"><input id="clientSearch" placeholder="ابحث بالاسم أو رقم الهاتف أو البريد" value="${esc(searchText)}"></div></div><div class="tablewrap">${arr.length?`<table><thead><tr><th>الاسم</th><th>الموبايل</th><th>البريد الإلكتروني</th><th>عدد الحجوزات</th><th>إجمالي قيمة الحجوزات</th><th>إجراءات</th></tr></thead><tbody>${arr.map(c=>{let bs=db.bookings.filter(b=>b.clientId===c.id);return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email||'—')}</td><td>${bs.length}</td><td>${money(bs.filter(b=>b.status!=='ملغي').reduce((s,b)=>s+Number(b.total),0))}</td><td><button class="secondary small" onclick="openClient('${c.id}')">تعديل</button> <button class="danger small" onclick="deleteClient('${c.id}')">حذف</button></td></tr>`}).join('')}</tbody></table>`:`<div class="empty"><div>♙</div>لا يوجد عملاء مسجلون</div>`}</div></div>`}
function paymentsPage(){let arr=[...db.payments].reverse().filter(p=>!searchText||[p.id,p.clientName,p.bookingId,p.method].join(' ').toLowerCase().includes(searchText.toLowerCase()));return `${pageHead('التحصيلات والمدفوعات','تسجيل كل دفعة وربطها بالحجز والعميل',`<button class="gold" onclick="openPayment()">＋ تسجيل تحصيل</button>`)}<div class="stats"><div class="stat"><div class="stat-top">إجمالي التحصيلات</div><strong style="font-size:21px">${money(db.payments.reduce((s,p)=>s+Number(p.amount),0))}</strong><small>كل الدفعات المسجلة</small></div><div class="stat"><div class="stat-top">عدد العمليات</div><strong>${db.payments.length}</strong><small>إيصالات التحصيل</small></div><div class="stat"><div class="stat-top">إجمالي المستحقات</div><strong style="font-size:21px">${money(db.bookings.filter(b=>b.status!=='ملغي').reduce((s,b)=>s+Math.max(0,b.total-paidFor(b.id)),0))}</strong><small>المتبقي على الحجوزات</small></div><div class="stat"><div class="stat-top">مصروفات مسجلة</div><strong style="font-size:21px">${money(db.expenses.reduce((s,e)=>s+Number(e.amount),0))}</strong><small>كل المصروفات</small></div></div><div class="panel"><div class="panelbody"><div class="searchrow"><input id="paymentSearch" placeholder="ابحث برقم الإيصال أو العميل أو الحجز" value="${esc(searchText)}"></div></div><div class="tablewrap">${arr.length?`<table><thead><tr><th>رقم الإيصال</th><th>التاريخ</th><th>رقم الحجز</th><th>العميل</th><th>المبلغ</th><th>طريقة الدفع</th><th>ملاحظات</th></tr></thead><tbody>${arr.map(p=>`<tr><td>${esc(p.id)}</td><td>${fmtDate(p.date)}</td><td>${esc(p.bookingId||'—')}</td><td>${esc(p.clientName)}</td><td><b>${money(p.amount)}</b></td><td>${esc(p.method)}</td><td>${esc(p.notes||'—')}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">لا توجد تحصيلات مسجلة</div>`}</div></div>`}
function expensesPage(){let arr=[...db.expenses].reverse().filter(e=>!searchText||[e.id,e.category,e.description,e.payee].join(' ').toLowerCase().includes(searchText.toLowerCase()));return `${pageHead('المصروفات','تسجيل مصروفات التشغيل والتجهيزات',`<button class="gold" onclick="openExpense()">＋ تسجيل مصروف</button>`)}<div class="stats"><div class="stat"><div class="stat-top">إجمالي المصروفات</div><strong style="font-size:21px">${money(db.expenses.reduce((s,e)=>s+Number(e.amount),0))}</strong><small>كل المصروفات المسجلة</small></div><div class="stat"><div class="stat-top">عدد المصروفات</div><strong>${db.expenses.length}</strong><small>عملية صرف</small></div></div><div class="panel"><div class="panelbody"><div class="searchrow"><input id="expenseSearch" placeholder="ابحث في التصنيف أو الوصف أو المستلم" value="${esc(searchText)}"></div></div><div class="tablewrap">${arr.length?`<table><thead><tr><th>رقم العملية</th><th>التاريخ</th><th>التصنيف</th><th>الوصف</th><th>المستلم</th><th>المبلغ</th><th>إجراءات</th></tr></thead><tbody>${arr.map(e=>`<tr><td>${esc(e.id)}</td><td>${fmtDate(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${esc(e.payee||'—')}</td><td><b>${money(e.amount)}</b></td><td><button class="danger small" onclick="deleteExpense('${e.id}')">حذف</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">لا توجد مصروفات مسجلة</div>`}</div></div>`}
function calendarPage(){let now=new Date(),y=now.getFullYear(),m=now.getMonth();let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let names=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let cells=names.map(n=>`<div class="dayname">${n}</div>`).join('');for(let i=0;i<first;i++)cells+='<div class="daycell"></div>';for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let bs=db.bookings.filter(b=>b.date===date&&b.status!=='ملغي');cells+=`<div class="daycell"><div class="daynum">${d}</div>${bs.slice(0,3).map(b=>`<span class="calitem ${b.status==='مبدئي'?'pending':''}" title="${esc(b.clientName)} - ${esc(hallName(b.hallId))}">${esc(hallName(b.hallId))}<br>${esc(b.clientName)}</span>`).join('')}${bs.length>3?`<small>+${bs.length-3} حجوزات</small>`:''}</div>`}return `${pageHead('تقويم القاعات',`مواعيد الشهر الحالي — ${now.toLocaleDateString('ar-EG',{month:'long',year:'numeric'})}`,`<button class="gold" onclick="openBooking()">＋ حجز جديد</button>`)}<div class="notice">يعرض التقويم حجوزات الشهر الحالي. الحجز المبدئي يظهر بلون مختلف عن الحجز المؤكد. منع التعارض يتم حسب القاعة والتاريخ والوقت المسجلين.</div><div class="panel"><div class="calendar">${cells}</div></div>`}
function reportsPage(){let rev=db.payments.reduce((s,p)=>s+Number(p.amount),0),out=db.expenses.reduce((s,e)=>s+Number(e.amount),0),booked=db.bookings.filter(b=>b.status!=='ملغي'),total=booked.reduce((s,b)=>s+Number(b.total),0),paid=booked.reduce((s,b)=>s+paidFor(b.id),0);let byHall=db.halls.map(h=>({name:h.name,count:booked.filter(b=>b.hallId===h.id).length,total:booked.filter(b=>b.hallId===h.id).reduce((s,b)=>s+Number(b.total),0)}));return `${pageHead('التقارير','ملخص تشغيلي ومالي مبني على البيانات المسجلة',`<button class="secondary" onclick="exportCSV()">تصدير الحجوزات CSV</button>`)}<div class="reporttiles"><div class="reporttile"><span>قيمة الحجوزات غير الملغاة</span><strong>${money(total)}</strong></div><div class="reporttile"><span>التحصيل الفعلي</span><strong>${money(paid)}</strong></div><div class="reporttile"><span>المتبقي للتحصيل</span><strong>${money(Math.max(0,total-paid))}</strong></div><div class="reporttile"><span>إجمالي المصروفات المسجلة</span><strong>${money(out)}</strong></div><div class="reporttile"><span>صافي الحركة النقدية</span><strong>${money(rev-out)}</strong></div><div class="reporttile"><span>حجوزات ملغاة</span><strong>${db.bookings.filter(b=>b.status==='ملغي').length}</strong></div></div><div class="panel" style="margin-top:18px"><div class="panelhead"><h4>أداء القاعات</h4></div><div class="tablewrap"><table><thead><tr><th>القاعة</th><th>عدد الحجوزات غير الملغاة</th><th>القيمة الإجمالية</th></tr></thead><tbody>${byHall.map(h=>`<tr><td>${esc(h.name)}</td><td>${h.count}</td><td>${money(h.total)}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد بيانات</td></tr>'}</tbody></table></div></div><div class="notice">تنبيه: التقرير المالي الحالي تشغيلي ومبسط؛ لا يتضمن الضرائب أو تكلفة كل حفلة التفصيلية أو قيود محاسبية مزدوجة. لا تعتمد عليه كقوائم مالية نهائية قبل استكمال النظام المحاسبي.</div>`}
function logsPage(){return `${pageHead('سجل العمليات','مراجعة التغييرات المسجلة داخل هذه النسخة',`<button class="secondary" onclick="exportLogs()">تصدير السجل CSV</button>`)}<div class="panel"><div class="tablewrap">${db.logs.length?`<table><thead><tr><th>التاريخ والوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th></tr></thead><tbody>${db.logs.map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(l.user)}</td><td>${esc(l.action)}</td><td>${esc(l.detail)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty"><div>◷</div>سجل العمليات سيظهر هنا عند تنفيذ العمليات</div>`}</div></div>`}
function settingsPage(){return `${pageHead('الإعدادات والنسخ الاحتياطي','تخصيص اسم المنشأة وحفظ نسخة من بياناتك',`<button class="gold" onclick="backup()">⬇ تنزيل نسخة احتياطية</button>`)}<div class="notice">هذه نسخة تجريبية تحفظ البيانات في المتصفح الحالي فقط. النسخة الاحتياطية مهمة قبل مسح بيانات المتصفح أو تغيير الجهاز.</div><div class="panel"><div class="panelhead"><h4>بيانات المنشأة</h4></div><div class="panelbody"><form onsubmit="saveSettings(event)"><div class="formgrid"><div class="field"><label>اسم المنشأة</label><input id="companyName" value="${esc(db.settings.company||'Wedding Halls ERP')}" required></div><div class="field"><label>العملة</label><select id="currency"><option ${db.settings.currency==='ج.م'?'selected':''}>ج.م</option><option ${db.settings.currency==='ر.س'?'selected':''}>ر.س</option><option ${db.settings.currency==='$'?'selected':''}>$</option></select></div></div><div class="formfoot"><button>حفظ الإعدادات</button></div></form></div></div><div class="panel"><div class="panelhead"><h4>النسخ الاحتياطي والاستعادة</h4></div><div class="panelbody"><p class="muted" style="font-size:13px;line-height:1.8">تقدر تنزّل ملف JSON يحتوي على القاعات والعملاء والحجوزات والتحصيلات والمصروفات وسجل العمليات. احتفظ به في مكان آمن.</p><div class="actions"><button onclick="backup()">تنزيل نسخة احتياطية</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">استعادة نسخة</button><input type="file" id="restoreFile" accept="application/json,.json" style="display:none" onchange="restoreBackup(event)"><button class="danger" onclick="resetDemo()">مسح بيانات التجربة</button></div></div></div><div class="panel"><div class="panelhead"><h4>معلومات النسخة</h4></div><div class="panelbody"><p>الإصدار: <b>Prototype 1.0</b></p><p>التخزين: <b>Local browser storage</b></p><p class="muted" style="font-size:12px">لا توجد حتى الآن حسابات مستخدمين فعلية أو مزامنة بين الأجهزة. يجب إضافة Backend وقاعدة بيانات مركزية قبل الاستخدام التشغيلي الحقيقي.</p></div></div>`}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalback').classList.add('open')}function closeModal(){document.getElementById('modalback').classList.remove('open')}function field(label,name,value='',type='text',required=true,extra=''){return `<div class="field"><label>${label}${required?' *':''}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}></div>`}function selectField(label,name,opts,value,required=true){return `<div class="field"><label>${label}${required?' *':''}</label><select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(o.value)}" ${o.value===value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`}
function openHall(hid=''){let h=db.halls.find(x=>x.id===hid)||{name:'',capacity:200,price:0,location:'',status:'نشطة',notes:''};openModal(hid?'تعديل بيانات القاعة':'إضافة قاعة جديدة',`<form onsubmit="saveHall(event,'${hid}')"><div class="formgrid">${field('اسم القاعة','name',h.name)}${field('السعة بالأفراد','capacity',h.capacity,'number',true,'min="1"')}${field('السعر الأساسي (ج.م)','price',h.price,'number',true,'min="0" step="0.01"')}${field('الموقع','location',h.location,'text',false)}${selectField('الحالة','status',[{value:'نشطة',label:'نشطة'},{value:'غير نشطة',label:'غير نشطة'}],h.status)}<div class="field"><label>ملاحظات</label><input name="notes" value="${esc(h.notes)}"></div></div><div class="formfoot"><button>حفظ القاعة</button><button type="button" class="secondary" onclick="closeModal()">إلغاء</button></div></form>`)}function saveHall(e,hid){e.preventDefault();let f=new FormData(e.target),data={name:f.get('name').trim(),capacity:Number(f.get('capacity')),price:Number(f.get('price')),location:f.get('location'),status:f.get('status'),notes:f.get('notes')};if(!data.name||data.capacity<1||data.price<0)return toast('راجع بيانات القاعة');if(hid){Object.assign(db.halls.find(h=>h.id===hid),data);log('تعديل قاعة',data.name)}else{data.id=id('H');db.halls.push(data);log('إضافة قاعة',data.name)}saveDB();closeModal();render();toast('تم حفظ بيانات القاعة')}
function openClient(cid=''){let c=db.clients.find(x=>x.id===cid)||{name:'',phone:'',email:'',notes:''};openModal(cid?'تعديل بيانات العميل':'إضافة عميل جديد',`<form onsubmit="saveClient(event,'${cid}')"><div class="formgrid">${field('اسم العميل','name',c.name)}${field('رقم الموبايل','phone',c.phone,'tel')}${field('البريد الإلكتروني','email',c.email,'email',false)}<div class="field full"><label>ملاحظات</label><textarea name="notes" rows="3">${esc(c.notes)}</textarea></div></div><div class="formfoot"><button>حفظ العميل</button><button type="button" class="secondary" onclick="closeModal()">إلغاء</button></div></form>`)}function saveClient(e,cid){e.preventDefault();let f=new FormData(e.target),data={name:f.get('name').trim(),phone:f.get('phone').trim(),email:f.get('email').trim(),notes:f.get('notes')};if(!data.name||!data.phone)return toast('الاسم والموبايل مطلوبان');if(db.clients.some(c=>c.phone===data.phone&&c.id!==cid))return toast('رقم الموبايل مسجل لعميل آخر');if(cid){Object.assign(db.clients.find(c=>c.id===cid),data);log('تعديل عميل',data.name)}else{data.id=id('C');db.clients.push(data);log('إضافة عميل',data.name)}saveDB();closeModal();render();toast('تم حفظ بيانات العميل')}
function openBooking(bid=''){let b=db.bookings.find(x=>x.id===bid)||{clientId:'',clientName:'',phone:'',hallId:db.halls[0]?.id||'',date:today(),time:'18:00',duration:5,total:'',status:'مبدئي',packageName:'',guests:100,notes:''};let halls=db.halls.filter(h=>h.status==='نشطة');if(!halls.length)return toast('أضف قاعة نشطة أولاً');let clients=db.clients;openModal(bid?'تعديل الحجز':'إنشاء حجز جديد',`<form onsubmit="saveBooking(event,'${bid}')"><div class="formgrid"><div class="field full"><label>اختيار عميل مسجل</label><select name="clientId" id="bookingClient" onchange="fillClient(this.value)"><option value="">— تسجيل عميل جديد من البيانات أدناه —</option>${clients.map(c=>`<option value="${c.id}" ${c.id===b.clientId?'selected':''}>${esc(c.name)} — ${esc(c.phone)}</option>`).join('')}</select></div>${field('اسم العميل','clientName',b.clientName)}${field('رقم الموبايل','phone',b.phone,'tel')}${selectField('القاعة','hallId',halls.map(h=>({value:h.id,label:`${h.name} — ${money(h.price)}`})),b.hallId)}${field('تاريخ الحفلة','date',b.date,'date')}${field('وقت بداية الحفلة','time',b.time,'time')}${field('المدة بالساعات','duration',b.duration||5,'number',true,'min="1" max="24"')}${field('عدد المدعوين','guests',b.guests||100,'number',true,'min="1"')}${field('اسم الباقة','packageName',b.packageName,'text',false)}${field('الإجمالي المتفق عليه (ج.م)','total',b.total||halls.find(h=>h.id===b.hallId)?.price||0,'number',true,'min="0" step="0.01"')}${selectField('حالة الحجز','status',[{value:'مبدئي',label:'مبدئي'},{value:'مؤكد',label:'مؤكد'},{value:'مكتمل',label:'مكتمل'},{value:'ملغي',label:'ملغي'}],b.status)}<div class="field full"><label>الخدمات والملاحظات</label><textarea name="notes" rows="3">${esc(b.notes||'')}</textarea></div></div><div class="notice" style="margin-top:15px">سيمنع النظام حجز نفس القاعة في نفس التاريخ إذا تداخل الوقت مع حجز آخر غير ملغي. الحجز المبدئي ليس تأكيدًا نهائيًا.</div><div class="formfoot"><button>حفظ الحجز</button><button type="button" class="secondary" onclick="closeModal()">إلغاء</button></div></form>`)}function fillClient(cid){let c=db.clients.find(x=>x.id===cid);if(!c)return;document.querySelector('[name="clientName"]').value=c.name;document.querySelector('[name="phone"]').value=c.phone}
function overlaps(aStart,aEnd,bStart,bEnd){return aStart<bEnd&&bStart<aEnd}function saveBooking(e,bid){e.preventDefault();let f=new FormData(e.target),data={clientId:f.get('clientId'),clientName:f.get('clientName').trim(),phone:f.get('phone').trim(),hallId:f.get('hallId'),date:f.get('date'),time:f.get('time'),duration:Number(f.get('duration')),guests:Number(f.get('guests')),packageName:f.get('packageName'),total:Number(f.get('total')),status:f.get('status'),notes:f.get('notes')};if(!data.clientName||!data.phone||!data.date||!data.time||data.total<0)return toast('راجع بيانات الحجز');let hall=db.halls.find(h=>h.id===data.hallId);if(!hall)return toast('القاعة غير موجودة');if(data.guests>Number(hall.capacity))return toast(`عدد المدعوين يتجاوز سعة القاعة (${hall.capacity})`);let start=data.time.split(':').reduce((s,v)=>s*60+Number(v),0),end=start+data.duration*60;if(end>2880)return toast('مدة الحجز غير صالحة');let conflict=db.bookings.find(x=>x.id!==bid&&x.hallId===data.hallId&&x.date===data.date&&x.status!=='ملغي'&&overlaps(start,end,x.time.split(':').reduce((s,v)=>s*60+Number(v),0),x.time.split(':').reduce((s,v)=>s*60+Number(v),0)+Number(x.duration||5)*60));if(conflict)return toast(`تعارض مع الحجز ${conflict.id} لنفس القاعة والموعد`);let client;if(data.clientId)client=db.clients.find(c=>c.id===data.clientId);if(!client){client=db.clients.find(c=>c.phone===data.phone);if(!client){client={id:id('C'),name:data.clientName,phone:data.phone,email:'',notes:''};db.clients.push(client);log('إضافة عميل تلقائية',client.name)}else{client.name=data.clientName;client.phone=data.phone}data.clientId=client.id}else{client.name=data.clientName;client.phone=data.phone}if(bid){let old=db.bookings.find(x=>x.id===bid);if(old.status==='ملغي'&&data.status!=='ملغي'&&db.payments.some(p=>p.bookingId===bid)){}Object.assign(old,data);log('تعديل حجز',`${bid} — ${data.clientName}`)}else{data.id=id('B');data.createdAt=new Date().toISOString();db.bookings.push(data);log('إنشاء حجز',`${data.id} — ${data.clientName} — ${hall.name}`)}saveDB();closeModal();render();toast('تم حفظ الحجز بنجاح')}
function openPayment(bid=''){let b=db.bookings.find(x=>x.id===bid),eligible=db.bookings.filter(x=>x.status!=='ملغي');if(!eligible.length)return toast('لا توجد حجوزات نشطة لتسجيل تحصيل');let remain=b?Math.max(0,b.total-paidFor(b.id)):0;openModal('تسجيل تحصيل جديد',`<form onsubmit="savePayment(event)"><div class="formgrid"><div class="field full"><label>الحجز</label><select name="bookingId" id="paymentBooking" required onchange="updateRemain()">${eligible.map(x=>`<option value="${x.id}" ${x.id===bid?'selected':''}>${x.id} — ${esc(x.clientName)} — متبقي ${money(Math.max(0,x.total-paidFor(x.id)))}</option>`).join('')}</select></div><div class="field"><label>المبلغ (ج.م) *</label><input name="amount" id="paymentAmount" type="number" min="0.01" step="0.01" value="${remain>0?remain:''}" required></div>${field('تاريخ التحصيل','date',today(),'date')}${selectField('طريقة الدفع','method',[{value:'نقدي',label:'نقدي'},{value:'تحويل بنكي',label:'تحويل بنكي'},{value:'بطاقة',label:'بطاقة بنكية'},{value:'محفظة إلكترونية',label:'محفظة إلكترونية'},{value:'أخرى',label:'أخرى'}],'نقدي')}${field('رقم مرجعي (اختياري)','reference','','text',false)}<div class="field full"><label>ملاحظات</label><textarea name="notes" rows="2"></textarea></div></div><div class="formfoot"><button>حفظ التحصيل</button><button type="button" class="secondary" onclick="closeModal()">إلغاء</button></div></form>`)}function updateRemain(){let b=db.bookings.find(x=>x.id===document.getElementById('paymentBooking').value);document.getElementById('paymentAmount').value=Math.max(0,b.total-paidFor(b.id))}function savePayment(e){e.preventDefault();let f=new FormData(e.target),b=db.bookings.find(x=>x.id===f.get('bookingId')),amount=Number(f.get('amount'));if(!b||amount<=0)return toast('أدخل مبلغًا صحيحًا');if(amount>Math.max(0,b.total-paidFor(b.id))+0.001)return toast('المبلغ أكبر من المتبقي على الحجز');let p={id:id('R'),bookingId:b.id,clientName:b.clientName,amount,date:f.get('date'),method:f.get('method'),reference:f.get('reference'),notes:f.get('notes')};db.payments.push(p);log('تسجيل تحصيل',`${p.id} — ${b.clientName} — ${money(amount)}`);saveDB();closeModal();render();toast('تم تسجيل التحصيل')}
function openExpense(){openModal('تسجيل مصروف',`<form onsubmit="saveExpense(event)"><div class="formgrid">${field('التاريخ','date',today(),'date')}${selectField('التصنيف','category',['تشغيل','ديكور','بوفيه','صيانة','أجور','مشتريات','تسويق','مرافق','أخرى'].map(x=>({value:x,label:x})),'تشغيل')}${field('المبلغ (ج.م)','amount','','number',true,'min="0.01" step="0.01"')}${field('المستلم / المورد','payee','','text',false)}<div class="field full"><label>وصف المصروف *</label><textarea name="description" rows="3" required></textarea></div></div><div class="formfoot"><button>حفظ المصروف</button><button type="button" class="secondary" onclick="closeModal()">إلغاء</button></div></form>`)}function saveExpense(e){e.preventDefault();let f=new FormData(e.target),x={id:id('E'),date:f.get('date'),category:f.get('category'),amount:Number(f.get('amount')),payee:f.get('payee'),description:f.get('description').trim()};if(x.amount<=0||!x.description)return toast('راجع بيانات المصروف');db.expenses.push(x);log('تسجيل مصروف',`${x.category} — ${money(x.amount)} — ${x.description}`);saveDB();closeModal();render();toast('تم تسجيل المصروف')}
function deleteBooking(bid){let b=db.bookings.find(x=>x.id===bid);if(!b)return;if(db.payments.some(p=>p.bookingId===bid))return toast('لا يمكن حذف الحجز لوجود تحصيلات مرتبطة به. غيّر الحالة إلى ملغي وراجع رد المبالغ.');if(!confirm('هل تريد إلغاء هذا الحجز؟ سيظل محفوظًا في السجل.'))return;b.status='ملغي';log('إلغاء حجز',`${bid} — ${b.clientName}`);saveDB();render();toast('تم إلغاء الحجز')}
function deleteHall(hid){let h=db.halls.find(x=>x.id===hid);if(db.bookings.some(b=>b.hallId===hid&&b.status!=='ملغي'))return toast('لا يمكن حذف قاعة مرتبطة بحجوزات غير ملغاة');if(!confirm('حذف القاعة '+h.name+'؟'))return;db.halls=db.halls.filter(x=>x.id!==hid);log('حذف قاعة',h.name);saveDB();render();toast('تم حذف القاعة')}
function deleteClient(cid){let c=db.clients.find(x=>x.id===cid);if(db.bookings.some(b=>b.clientId===cid))return toast('لا يمكن حذف عميل مرتبط بحجوزات');if(!confirm('حذف العميل '+c.name+'؟'))return;db.clients=db.clients.filter(x=>x.id!==cid);log('حذف عميل',c.name);saveDB();render();toast('تم حذف العميل')}
function deleteExpense(eid){let x=db.expenses.find(e=>e.id===eid);if(!confirm('حذف المصروف '+eid+'؟'))return;db.expenses=db.expenses.filter(e=>e.id!==eid);log('حذف مصروف',`${eid} — ${money(x.amount)}`);saveDB();render();toast('تم حذف المصروف')}
function saveSettings(e){e.preventDefault();db.settings.company=document.getElementById('companyName').value.trim();db.settings.currency=document.getElementById('currency').value;log('تعديل الإعدادات',db.settings.company);saveDB();toast('تم حفظ الإعدادات')}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='wedding-halls-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);log('تنزيل نسخة احتياطية','تم طلب تنزيل نسخة JSON');saveDB();toast('تم تجهيز النسخة الاحتياطية')}
function restoreBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.halls||!x.bookings||!x.clients||!x.payments||!x.expenses)throw new Error('bad');if(!confirm('استعادة النسخة ستستبدل البيانات الحالية. هل تريد المتابعة؟'))return;db=x;log('استعادة نسخة احتياطية',file.name);saveDB();render();toast('تمت استعادة النسخة')}catch(err){toast('ملف النسخة غير صالح')}e.target.value=''};r.readAsText(file)}function resetDemo(){if(!confirm('سيتم مسح كل البيانات المسجلة في هذا المتصفح وإرجاع القاعات الافتراضية. هل أنت متأكد؟'))return;db=structuredClone(initial);saveDB();go('dashboard');toast('تمت إعادة ضبط بيانات التجربة')}
function exportCSV(){let rows=[['رقم الحجز','العميل','الموبايل','القاعة','التاريخ','الوقت','المدة','المدعوين','الإجمالي','المدفوع','المتبقي','الحالة'],...db.bookings.map(b=>[b.id,b.clientName,b.phone,hallName(b.hallId),b.date,b.time,b.duration,b.guests,b.total,paidFor(b.id),Math.max(0,b.total-paidFor(b.id)),b.status])];downloadCSV(rows,'wedding-bookings.csv')}function exportLogs(){downloadCSV([['التاريخ','المستخدم','العملية','التفاصيل'],...db.logs.map(l=>[l.date,l.user,l.action,l.detail])],'wedding-logs.csv')}function downloadCSV(rows,name){let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);toast('تم تصدير الملف')}
render();
